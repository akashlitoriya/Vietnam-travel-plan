<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnam trip map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly, practical trip planner
   IDEA: a pocket map of Vietnam with the doc's places stuck on it like stickers
   PICTURE: the map itself, jade sea and rice-paper land, filling the frame
   COLOUR and TYPE: jade water, lacquer-red route, category dots; Be Vietnam Pro
   LAYOUT: map fills the frame, place list at right, below the map on phones */
:root{color-scheme:light dark;
 --sea:light-dark(#9fd2c8,#0e2b2c);--land:light-dark(#f6f3e3,#21392e);--nb:light-dark(#e2e6dc,#18252a);
 --coast:light-dark(#5f8f78,#4c7d68);--river:light-dark(#74bccd,#2b6973);
 --bg:light-dark(#ffffff,#111917);--ink:light-dark(#17201d,#ecf1ed);--mute:light-dark(#56635e,#9eaca6);
 --line:light-dark(#e1e6e0,#26312e);--chip:light-dark(#f1f5f0,#1a2522);--halo:light-dark(#ffffff,#0e1614);
 --red:light-dark(#c42a1e,#ff6a5c);
 --c-sight:light-dark(#c42a1e,#ff6a5c);--c-food:light-dark(#23844f,#4fcf86);--c-shop:light-dark(#c98a00,#f5c044);
 --c-photo:light-dark(#9c3489,#e07ad0);--c-stay:light-dark(#2461a6,#6fa8f0)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c-stay);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:100vh;height:100dvh}
.mapw{position:relative;background:var(--sea);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.land path{fill:var(--nb);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke}
.land path.vn{fill:var(--land);stroke-width:1.1}
.lakes path{fill:var(--sea);stroke:var(--river);stroke-width:.6;vector-effect:non-scaling-stroke}
.rivers path{fill:none;stroke:var(--river);stroke-width:1;vector-effect:non-scaling-stroke}
.route path{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route path.fly{stroke-dasharray:1 7;stroke-width:3}
.route circle{fill:var(--halo);stroke:var(--red);stroke-width:2.6}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .dot{fill:var(--c);stroke:var(--halo);stroke-width:2}
.pin.must .dot{stroke-width:2.6}
.pin.sel .dot{stroke:var(--ink);stroke-width:2.6}
.pin.sel .ring{fill:none;stroke:var(--c);stroke-width:2.5;opacity:.45}
.pin.hl .dot{stroke:var(--ink)}
text{paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.lbl{font-size:12.5px;font-weight:500;fill:var(--ink)}
.lbl.must{font-weight:600}
.city{font-size:14px;font-weight:700;fill:var(--ink)}
.ctry{font-size:13px;font-weight:500;fill:var(--mute);stroke-width:0}
.rlbl{font-size:12px;font-weight:700;fill:var(--red)}
.regions{position:absolute;top:10px;left:10px;right:66px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.regions::-webkit-scrollbar{display:none}
.regions button{flex:none;min-height:38px;padding:0 13px;border-radius:999px;border:0;background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.18);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.regions button.on{background:var(--ink);color:var(--bg)}
.ctrl{position:absolute;top:10px;right:10px;display:grid;gap:6px}
.ctrl button{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.2);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.ctrl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.hint{position:absolute;right:10px;bottom:10px;font-size:12.5px;color:var(--mute);background:var(--bg);padding:5px 10px;border-radius:8px;opacity:.92;transition:opacity .4s}
.hint.gone{opacity:0;pointer-events:none}
.card{position:absolute;left:10px;bottom:10px;width:min(370px,calc(100% - 20px));max-height:calc(100% - 70px);overflow:auto;background:var(--bg);border-radius:14px;box-shadow:0 6px 24px rgb(0 0 0/.22);padding:14px 16px 16px}
.card[hidden]{display:none}
.card .x{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--c)}
.pill i,.cat i,.item i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.card h3{font-size:20px;line-height:1.15;margin:6px 44px 4px 0;text-wrap:balance}
.card .addr{color:var(--mute);font-size:13.5px;margin:0 0 6px}
.card p{margin:0 0 8px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);margin:0 6px 8px 0;white-space:nowrap}
.tag.warn{background:color-mix(in srgb,var(--c-shop) 18%,transparent);color:light-dark(#7a5300,#f5c044)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.acts a{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
.acts a.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.side{display:flex;flex-direction:column;border-left:1px solid var(--line);overflow:hidden}
.head{padding:16px 16px 8px;display:grid;gap:10px}
h1{font-size:28px;line-height:1.05;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13.5px;margin:3px 0 0}
#q{width:100%;height:44px;font-size:16px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px;cursor:pointer;white-space:nowrap}
.cat[aria-pressed=false]{opacity:.42}
.cat .n{color:var(--mute);font-variant-numeric:tabular-nums}
.cat.rt i{width:16px;height:3px;border-radius:2px;background:var(--red)}
.list{flex:1;overflow-y:auto;padding:0 8px 8px;overscroll-behavior:contain}
.grp h2{position:sticky;top:0;z-index:1;background:var(--bg);font-size:13px;font-weight:600;color:var(--mute);margin:0;padding:12px 10px 6px}
.item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer}
.item i{margin-top:6px}
.item:hover,.item.on{background:var(--chip)}
.item b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.item small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day{font-size:12px;font-weight:600;color:var(--red);white-space:nowrap;margin-top:2px}
.empty{padding:20px 12px;color:var(--mute)}
details.unp{margin:10px 2px 4px;border-top:1px solid var(--line);padding-top:6px}
details.unp summary{cursor:pointer;padding:10px 8px;font-weight:600;font-size:14px;min-height:44px}
.u{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:7px 10px}
.u i{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:6px}
.u b{font-weight:600;font-size:14px}
.u small{display:block;color:var(--mute);font-size:13px}
.u a{color:var(--c-stay);font-size:13px;font-weight:600}
.foot{font-size:12px;color:var(--mute);padding:8px 16px 12px;border-top:1px solid var(--line)}
@media(max-width:760px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:54% minmax(0,1fr)}
 .cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
 .cats::-webkit-scrollbar{display:none}
 .foot{display:none}
 .side{border-left:0;border-top:1px solid var(--line)}
 .head{padding:12px 12px 6px;gap:8px} h1{font-size:22px} .sub{display:none}
 .hint{display:none}
 .card{max-height:calc(100% - 64px);padding:12px 14px}
 .card h3{font-size:18px}
}
@media(prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>
<div class="app">
 <div class="mapw" id="mapw">
  <svg id="map" role="img" aria-label="Map of Vietnam with trip places">
   <g id="world"><g class="land"></g><g class="lakes"></g><g class="rivers"></g></g>
   <g id="ov"><g class="route"></g><g class="pins"></g><g class="labels"></g></g>
  </svg>
  <nav class="regions" id="regions" aria-label="Jump to area"></nav>
  <div class="ctrl">
   <button id="zin" aria-label="Zoom in">+</button>
   <button id="zout" aria-label="Zoom out">&minus;</button>
   <button id="zfit" aria-label="Show all of Vietnam"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="hint" id="hint">Drag to move &middot; scroll or pinch to zoom &middot; tap a pin</div>
  <section class="card" id="card" hidden aria-live="polite"></section>
 </div>
 <aside class="side">
  <div class="head">
   <div><h1>Vietnam trip map</h1><p class="sub" id="sub"></p></div>
   <input id="q" type="search" placeholder="Search places, streets, notes" aria-label="Search places" autocomplete="off">
   <div class="cats" id="cats"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="foot">Pins resolved from your doc's Google Maps links and Google Maps search. Coastline: Natural Earth.</div>
 </aside>
</div>

  const pts=D.route.map(r=>({...r,s:sc(proj(r.lat,r.lng))}));
  const segs=[];for(let i=1;i<pts.length;i++){const a=pts[i-1].s,b=pts[i].s;
   if(pts[i].fly){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1];const cx=mx+dy*.22,cy=my-dx*.22;segs.push({fly:1,d:`M${a}Q${cx},${cy} ${b}`})}
   else segs.push({fly:0,d:`M${a}L${b}`});}
  RG.selectAll('path').data(segs).join('path').attr('class',s=>s.fly?'fly':null).attr('d',s=>s.d);
  RG.selectAll('circle').data(stops).join('circle').attr('r',5.5).attr('cx',s=>sc(s.xy)[0]).attr('cy',s=>sc(s.xy)[1]);
 }
 // pins
 pinG.each(function(p){const [x,y]=sc(p.xy);p.s=[x,y];p.on=vis(p)&&x>-30&&y>-30&&x<W+30&&y<H+30;
  this.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})`);this.style.display=vis(p)?'':'none';});
 pinG.classed('sel',p=>p.i===sel).classed('hl',p=>p.i===hl).select('.ring').attr('r',p=>p.i===sel?14:0);
 if(sel>=0){const n=pinG.nodes()[sel];n.parentNode.appendChild(n);}
 // labels (greedy, no overlaps)
 const boxes=[],out=[];
 const hit=b=>boxes.some(o=>b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y);
 const put=(b,l)=>{if(b.x<2||b.y<2||b.x+b.w>W-2||b.y+b.h>H-2||hit(b))return false;boxes.push(b);if(l)out.push(l);return true};
 boxes.push({x:0,y:0,w:W,h:54},{x:W-62,y:0,w:62,h:170});
 if(!card.hidden){const r=card.getBoundingClientRect(),m=mapw.getBoundingClientRect();boxes.push({x:r.left-m.left-4,y:r.top-m.top-4,w:r.width+8,h:r.height+8})}
 const shown=PL.filter(p=>p.on);
 const ord=[...shown].sort((a,b)=>(b.i===sel)-(a.i===sel)||(b.i===hl)-(a.i===hl)||(b.must-a.must)||(a.c==='stay')-(b.c==='stay'));
 if(sel>=0&&PL[sel].on)ord.slice(0,1).forEach(p=>lab(p));
 if(showRoute)stops.forEach(s=>{const [x,y]=sc(s.xy);const t=(s.ds.length>1?'Days ':s.ds[0].includes('–')?'Days ':'Day ')+s.ds.join(', ');const w=tw(t,'700 12px');put({x:x-w/2-2,y:y+8,w:w+4,h:15},{t,x,y:y+20,cls:'rlbl',a:'middle'})});
 if(T.k<28)CITY.forEach(([n,la,lo])=>{const [x,y]=sc(proj(la,lo));const w=tw(n,'700 14px');put({x:x-w/2-2,y:y-26,w:w+4,h:18},{t:n,x,y:y-12,cls:'city',a:'middle'})});
 if(T.k<5)CTRY.forEach(([n,la,lo])=>{const [x,y]=sc(proj(la,lo));const w=tw(n,'500 13px');put({x:x-w/2,y:y-12,w,h:16},{t:n,x,y,cls:'ctry',a:'middle'})});
 shown.forEach(p=>boxes.push({x:p.s[0]-6,y:p.s[1]-6,w:12,h:12}));
 function lab(p){if(p.done===draw.n)return;const f=(p.must?'600':'500')+' 12.5px';const w=tw(p.n,f),[x,y]=p.s;
  if(put({x:x+9,y:y-8,w:w+3,h:16},{t:p.n,x:x+10,y:y+4.5,cls:'lbl'+(p.must?' must':''),a:'start'})||put({x:x-12-w,y:y-8,w:w+3,h:16},{t:p.n,x:x-10,y:y+4.5,cls:'lbl'+(p.must?' must':''),a:'end'}))p.done=draw.n;}
 draw.n=(draw.n||0)+1;
 ord.forEach(lab);
 d3.select('#ov .labels').selectAll('text').data(out).join('text').attr('class',l=>l.cls).attr('x',l=>l.x).attr('y',l=>l.y).attr('text-anchor',l=>l.a).text(l=>l.t);
}

// zoom
const zoom=d3.zoom().scaleExtent([.15,2500]).on('zoom',e=>{T=e.transform;world.attr('transform',T);schedule();if(e.sourceEvent)hint()});
svg.call(zoom).on('click',()=>{if(sel>=0)select(-1)});
const viewT=(b,padTop=58)=>{const [x0,y0]=proj(b[2],b[1]),[x1,y1]=proj(b[0],b[3]);const pw=W-40,ph=H-padTop-24;
 const k=Math.min(pw/(x1-x0),ph/(y1-y0));return d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,padTop+ph/2-k*(y0+y1)/2).scale(k)};
const go=(t,ms=750)=>svg.transition().duration(reduce?0:ms).call(zoom.transform,t);
const vk=id=>viewT(VIEWS.find(v=>v[0]===id)[2]).k;
function flyTo(p){const id=p.r==='hcmc'?(p.lat>10.762&&p.lat<10.797&&p.lng>106.686&&p.lng<106.706?'d1':'hcmc'):p.r==='hoian'&&p.lat>15.95?'danang':p.r;
 const k=Math.max(T.k,vk(id)),[x,y]=p.xy;const cy=W<=760&&innerWidth<=760?H*.36:H*.45;go(d3.zoomIdentity.translate(W/2-k*x,cy-k*y).scale(k))}
d3.select('#zin').on('click',()=>svg.transition().duration(reduce?0:300).call(zoom.scaleBy,2));
d3.select('#zout').on('click',()=>svg.transition().duration(reduce?0:300).call(zoom.scaleBy,.5));
d3.select('#zfit').on('click',()=>{setView('all')});
let hinted=false;const hint=()=>{if(!hinted){hinted=true;document.getElementById('hint').classList.add('gone')}};

// regions
const RB=document.getElementById('regions');
RB.innerHTML=VIEWS.map(v=>`<button data-v="${v[0]}">${esc(v[1])}</button>`).join('');
RB.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
function setView(id){RB.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===id));go(viewT(VIEWS.find(v=>v[0]===id)[2]))}

// card
const gmap=p=>p.link&&/google|goo\.gl/.test(p.link)?p.link:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.n+', '+p.addr+', Vietnam');
const refName=u=>/instagram/.test(u)?'Instagram post':/youtu/.test(u)?'Reference video':/tripadvisor/.test(u)?'Tripadvisor':/airbnb/.test(u)?'Listing':'Link';
function select(i,fly){
 sel=i;document.querySelectorAll('.item.on').forEach(e=>e.classList.remove('on'));
 if(i<0){card.hidden=true;schedule();return}
 const p=PL[i];
 if(!vis(p)){state.cats.add(p.c);state.q='';document.getElementById('q').value='';renderSide()}
 const extra=[p.ref&&p.ref!==p.link?p.ref:'',p.link&&!/google|goo\.gl/.test(p.link)?p.link:''].filter(Boolean);
 card.style.setProperty('--c',`var(--c-${p.c})`);
 card.innerHTML=`<button class="x" aria-label="Close">&times;</button>
  <span class="pill"><i></i>${esc(CATS[p.c])} &middot; ${esc(GROUPS[p.r].split(' (')[0])}</span>
  <h3>${esc(p.n)}</h3>${p.addr?`<p class="addr">${esc(p.addr)}</p>`:''}
  ${p.day?`<span class="tag">${esc(p.day)} of the plan</span>`:''}${p.must?`<span class="tag">Must visit</span>`:''}${p.approx?`<span class="tag warn">Approximate pin</span>`:''}
  ${p.note?`<p>${esc(p.note)}</p>`:''}
  <div class="acts"><a class="pri" href="${esc(gmap(p))}" target="_blank" rel="noopener">Open in Google Maps</a>${extra.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${refName(u)}</a>`).join('')}</div>`;
 card.hidden=false;card.querySelector('.x').onclick=()=>select(-1);
 const li=document.querySelector(`.item[data-i="${i}"]`);if(li){li.classList.add('on');li.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})}
 if(fly)flyTo(p);schedule();
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel>=0)select(-1)});

// side panel
const catsEl=document.getElementById('cats'),listEl=document.getElementById('list');
function renderSide(){
 const qm=p=>!state.q||p.hay.includes(state.q);
 catsEl.innerHTML=Object.keys(CATS).map(c=>`<button class="cat" style="--c:var(--c-${c})" data-c="${c}" aria-pressed="${state.cats.has(c)}"><i></i>${CATS[c]} <span class="n">${PL.filter(p=>p.c===c&&qm(p)).length}</span></button>`).join('')
  +`<button class="cat rt" data-route="1" aria-pressed="${state.route}"><i></i>Trip route</button>`;
 const items=PL.filter(vis);
 const groups=Object.keys(GROUPS).map(g=>[g,items.filter(p=>p.r===g).sort((a,b)=>(b.must-a.must)||(a.day?0:1)-(b.day?0:1)||a.n.localeCompare(b.n))]).filter(g=>g[1].length);
 const un=UN.filter(u=>state.cats.has(u.c)&&(!state.q||fold(u.n+' '+u.note).includes(state.q)));
 listEl.innerHTML=(groups.length?groups.map(([g,ps])=>`<section class="grp"><h2>${esc(GROUPS[g])} &middot; ${ps.length}</h2>${ps.map(p=>`<button class="item${p.i===sel?' on':''}" data-i="${p.i}" style="--c:var(--c-${p.c})"><i></i><span><b>${esc(p.n)}</b><small>${esc([p.addr,p.note].filter(Boolean).join(' · '))}</small></span>${p.day?`<span class="day">${esc(p.day)}</span>`:'<span></span>'}</button>`).join('')}</section>`).join('')
  :`<p class="empty">No places match “${esc(document.getElementById('q').value)}”.</p>`)
  +(un.length?`<details class="unp"><summary>Not on the map &middot; ${un.length}</summary>${un.map(u=>`<div class="u" style="--c:var(--c-${u.c})"><i></i><span><b>${esc(u.n)}</b><small>${esc(GROUPS[u.r].split(' (')[0])} &middot; ${esc(u.note)}</small>${u.link?`<a href="${esc(u.link)}" target="_blank" rel="noopener">${refName(u.link)}</a>`:`<a href="https://www.google.com/search?q=${encodeURIComponent(u.n+' '+GROUPS[u.r].split(' (')[0])}" target="_blank" rel="noopener">Search Google</a>`}</span></div>`).join('')}</details>`:'');
 document.getElementById('sub').textContent=`${PL.length} pinned places from your Vietnam doc · 25 Nov – 9 Dec 2026`;
 schedule();
}
catsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.route){state.route=!state.route}else{const c=b.dataset.c;
  if(state.cats.size===Object.keys(CATS).length&&!e.shiftKey){state.cats=new Set([c])}else if(state.cats.has(c)){state.cats.delete(c);if(!state.cats.size)state.cats=new Set(Object.keys(CATS))}else state.cats.add(c)}
 if(sel>=0&&!vis(PL[sel]))select(-1);renderSide()});
listEl.addEventListener('click',e=>{const b=e.target.closest('.item');if(b)select(+b.dataset.i,true)});
listEl.addEventListener('mouseover',e=>{const b=e.target.closest('.item');const i=b?+b.dataset.i:-1;if(i!==hl){hl=i;schedule()}});
listEl.addEventListener('mouseleave',()=>{hl=-1;schedule()});
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{state.q=fold(qEl.value.trim());renderSide()});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const p=PL.find(vis);if(p)select(p.i,true)}});

// size
let first=true;
const ro=new ResizeObserver(()=>{const r=document.getElementById('mapw').getBoundingClientRect();W=r.width;H=r.height;svg.attr('viewBox',`0 0 ${W} ${H}`);
 if(first&&W>0){first=false;const t=viewT(VIEWS[0][2]);svg.call(zoom.transform,t);RB.querySelector('button').classList.add('on')}schedule()});
ro.observe(document.getElementById('mapw'));
renderSide();
}
</script>
</body>
</html>
